[project]
name = "norm-boundary"
version = "0.1.0"
description = "When Instance Normalization Hides the Level: an audit of exogenous covariate forecasting"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "requests>=2.31",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "canary: leakage canaries (G7 audit) — synthetic end-to-end leak detectors",
]
